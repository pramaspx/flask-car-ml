<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Car Sales Analytics{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body{background:#f4f6fb;color:#20283a}.navbar{background:#172554}
    .navbar-brand,.nav-link{color:white!important}.card{border:0;border-radius:14px;box-shadow:0 4px 18px #1725540c}
    .metric{font-size:1.55rem;font-weight:700}.chart-box{min-height:300px}
    .table thead{background:#eaf0ff}.btn-primary{background:#3156c9;border-color:#3156c9}
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark mb-4"><div class="container">
<a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">🚗 CarSales Analytics</a>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="nav"><div class="navbar-nav ms-auto">
<a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
<a class="nav-link" href="{{ url_for('sales') }}">Data Penjualan</a>
<a class="nav-link" href="{{ url_for('machine_learning') }}">Machine Learning</a>
</div></div></div></nav>
<main class="container pb-5">
{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}
<div class="alert alert-{{ category }} alert-dismissible fade show">{{ message }}<button class="btn-close" data-bs-dismiss="alert"></button></div>
{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body></html>
